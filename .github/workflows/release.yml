name: Release

# A tag is the trigger, so what is published is always a commit that exists.
# The version *is* the tag (hatch-vcs), so there is nothing to keep in step —
# only something to confirm: the check below catches a checkout that arrived
# without its tags, which would otherwise publish a dev version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # hatch-vcs reads the version off the tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Built version is the tag
        # A version can never be re-uploaded to PyPI, so a mismatch has to
        # stop here rather than after the upload. It can only differ if the
        # tag was not there to be read — a shallow checkout, or a build off
        # a branch — in which case what is in dist/ is a dev version.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | head -1 | cut -d- -f2)
          [ "$tag" = "$built" ] || { echo "::error::tag $tag != built $built"; exit 1; }
      # The page only works if its stylesheet and templates ship.
      - name: Wheel carries the page
        run: |
          listing=$(unzip -l dist/*.whl)
          for f in timon/app/static/style/app.css timon/app/templates/index.html; do
            grep -q "$f" <<<"$listing" || { echo "::error::$f is missing from the wheel"; exit 1; }
          done
      # Catches a README that PyPI would reject or render wrong.
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing — no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
