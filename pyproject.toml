[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timon"
dynamic = ["version"]
description = "Toolkit of Integrated MicrobiOme analysis with support for Nanopore data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Thomas Deschênes" }]
keywords = ["bioinformatics", "metagenomics", "nanopore", "nextflow"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Nextflow is a runtime requirement but is not a Python package; the conda
# recipe declares it. A pip install must provide it separately.
dependencies = [
    "flask>=3.0",
    "flask-socketio>=5.3",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/dsamoht/timon"

[project.scripts]
timon = "timon.cli:main"

[tool.hatch.version]
path = "src/timon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/timon"]
